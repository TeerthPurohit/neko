app = "neko-teerth"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AGENT_SERVICE_URL = "http://127.0.0.1:8081"
  CHAT_MODELS = "xiaomi/mimo-v2.6-pro"
  CLASSIFIER_MODEL = "typesafe/jev-1.13"
  ALLOW_PAID_AI = "true"
  MONTHLY_AI_BUDGET_USD = "2"
  DAILY_AI_REQUESTS = "100"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "45s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
